[project]
name = "chuyendektpm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1,<1",
    "mcp==2.3.0",
    "pydantic>=2.14.3,<3",
    "pyyaml>=6.0.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
